name: Aggiorna dati E-Beauty Analyst

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install requests

      - name: Raccogli i dati da Google Trends
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python raccogli.py

      - name: Salva se qualcosa e' cambiato
        run: |
          git config user.name "Aggiornamento automatico"
          git config user.email "actions@github.com"
          git add dati.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "Dati aggiornati $(date +%Y-%m-%d)"
            git push
          fi
